<p><script>
    // Embedded JS Engine Fallback (ensures 100% operational functionality in Brightspace single HTML upload)
    if (typeof RafterApp === 'undefined') {
        const RafterMath = {
            randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
            toTotalInches(feet, inches = 0) { return feet * 12 + inches; },
            formatFeetInches(totalInches) {
                if (totalInches == null || isNaN(totalInches)) return "0' 0\"";
                const isNeg = totalInches < 0;
                const absInc = Math.abs(totalInches);
                let feet = Math.floor(absInc / 12);
                let remInc = absInc % 12;
                let wholeInches = Math.floor(remInc);
                let frac = remInc - wholeInches;
                let sixteenths = Math.round(frac * 16);
                if (sixteenths === 16) { wholeInches += 1; sixteenths = 0; if (wholeInches === 12) { feet += 1; wholeInches = 0; } }
                let fracStr = "";
                if (sixteenths > 0) {
                    let num = sixteenths, den = 16;
                    const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                    const div = gcd(num, den);
                    fracStr = ` ${num/div}/${den/div}`;
                }
                const inchStr = (wholeInches === 0 && fracStr !== "") ? fracStr.trim() : `${wholeInches}${fracStr}`;
                return `${isNeg ? '-' : ''}${feet}' ${inchStr}"`;
            },
            formatDecimalFeet(totalInches) { return (totalInches / 12).toFixed(3) + " ft"; },
            formatDecimalInches(totalInches) { return totalInches.toFixed(2) + '"'; },
            parseInputToInches(inputStr) {
                if (!inputStr) return null;
                let str = inputStr.trim().toLowerCase().replace(/ft|feet/g, "'").replace(/in|inch|inches/g, '"');
                const ftInchRegex = /^(-?\d+)\s*(?:'|ft|-|\s)\s*(\d+)?(?:\s+(\d+)\/(\d+))?\s*"?$/;
                const match = str.match(ftInchRegex);
                if (match) {
                    const feet = parseInt(match[1], 10) || 0;
                    const inches = parseInt(match[2], 10) || 0;
                    const num = parseInt(match[3], 10) || 0;
                    const den = parseInt(match[4], 10) || 1;
                    return (feet * 12) + inches + (num / den);
                }
                const cleanNum = str.replace(/[^0-9.-]/g, '');
                const parsed = parseFloat(cleanNum);
                return !isNaN(parsed) ? parsed : null;
            }
        };

        window.RafterApp = {
            params: {}, questionsList: [], questionStates: {},
            generateParameters() {
                const bFeet = RafterMath.randomInt(30, 64), bInches = RafterMath.randomInt(0, 11);
                const buildingLengthInches = RafterMath.toTotalInches(bFeet, bInches);
                let majFeet = RafterMath.randomInt(16, Math.min(40, bFeet - 1)), majInches = RafterMath.randomInt(0, 11);
                let majorSpanInches = RafterMath.toTotalInches(majFeet, majInches);
                if (majorSpanInches >= buildingLengthInches) majorSpanInches = buildingLengthInches - 12;
                const maxMinFeet = Math.min(30, Math.floor(majorSpanInches / 12) - 1);
                const minFeet = RafterMath.randomInt(12, Math.max(12, maxMinFeet));
                let minorSpanInches = RafterMath.toTotalInches(minFeet, RafterMath.randomInt(0, 11));
                if (minorSpanInches >= majorSpanInches) minorSpanInches = majorSpanInches - 12;
                const maxOffsetInches = (buildingLengthInches - 60) - minorSpanInches - 1;
                const minorOffsetInches = RafterMath.randomInt(12, Math.max(12, maxOffsetInches));
                const minorProjectionInches = RafterMath.toTotalInches(RafterMath.randomInt(6, 12), RafterMath.randomInt(0, 11));
                const slopes = [
                    { rise: 4, run: 12, ratioText: "4/12 (or 1:3)" }, { rise: 5, run: 12, ratioText: "5/12" },
                    { rise: 6, run: 12, ratioText: "6/12 (or 1:2)" }, { rise: 7, run: 12, ratioText: "7/12" },
                    { rise: 8, run: 12, ratioText: "8/12 (or 2:3)" }, { rise: 9, run: 12, ratioText: "9/12 (or 3:4)" },
                    { rise: 10, run: 12, ratioText: "10/12 (or 5:6)" }, { rise: 11, run: 12, ratioText: "11/12" },
                    { rise: 12, run: 12, ratioText: "12/12 (or 1:1)" }
                ];
                const roofSlope = slopes[RafterMath.randomInt(0, slopes.length - 1)];
                const ocSpacing = RafterMath.randomInt(0, 1) === 0 ? 16 : 24;
                const possible = [];
                for (let i = 9; i <= ocSpacing; i++) possible.push(i);
                for (let i = possible.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [possible[i], possible[j]] = [possible[j], possible[i]]; }
                const paramA = possible[0], paramB = possible[1], paramC = possible[2], paramD = possible[3];
                const riseOverRun = roofSlope.rise / roofSlope.run;
                const sgf90 = Math.sqrt(Math.pow(riseOverRun, 2) + 1), sgf45 = Math.sqrt(Math.pow(riseOverRun, 2) + 2);
                this.params = { buildingLengthInches, majorSpanInches, minorOffsetInches, minorSpanInches, minorProjectionInches, roofSlope, ocSpacing, paramA, paramB, paramC, paramD, sgf90, sgf45 };
                this.displayParameters();
                this.questionsList = this.getQuestions();
                this.renderAllQuestionsUI();
            },
            displayParameters() {
                const p = this.params;
                document.getElementById('parameters-list').innerHTML = `
                    <div class="param-card"><span class="param-label">1. Building Length:</span> <span class="param-val">${RafterMath.formatFeetInches(p.buildingLengthInches)}</span></div>
                    <div class="param-card"><span class="param-label">2. Major Span:</span> <span class="param-val">${RafterMath.formatFeetInches(p.majorSpanInches)}</span></div>
                    <div class="param-card"><span class="param-label">3. Minor Offset from Corner:</span> <span class="param-val">${RafterMath.formatFeetInches(p.minorOffsetInches)}</span></div>
                    <div class="param-card"><span class="param-label">4. Minor Span:</span> <span class="param-val">${RafterMath.formatFeetInches(p.minorSpanInches)}</span></div>
                    <div class="param-card"><span class="param-label">5. Minor Wall Projection:</span> <span class="param-val">${RafterMath.formatFeetInches(p.minorProjectionInches)}</span></div>
                    <div class="param-card"><span class="param-label">6. Roof Slope:</span> <span class="param-val highlight-slope">${p.roofSlope.ratioText}</span></div>
                    <div class="param-card"><span class="param-label">7. On Center (O.C.) Spacing:</span> <span class="param-val">${p.ocSpacing}" O.C.</span></div>
                    <div class="param-card param-sub-group"><span class="param-label">Parameters (A, B, C, D):</span> <span class="param-val">A = ${p.paramA}", B = ${p.paramB}", C = ${p.paramC}", D = ${p.paramD}"</span></div>
                `;
            },
            getQuestions() {
                const p = this.params;
                return [
                    { id: 1, title: "1. What is your 90 degree SGF?", type: "single", unitType: "factor", targetValue: p.sgf90, formula: "SGF (90°) = √((Rise / Run)² + 1)", explanation: `SGF (90°) = √((${p.roofSlope.rise}/${p.roofSlope.run})² + 1) = ${p.sgf90.toFixed(4)}` },
                    { id: 2, title: "2. What is your 45 degree SGF?", type: "single", unitType: "factor", targetValue: p.sgf45, formula: "SGF (45°) = √((Rise / Run)² + 2)", explanation: `SGF (45°) = √((${p.roofSlope.rise}/${p.roofSlope.run})² + 2) = ${p.sgf45.toFixed(4)}` },
                    { id: 3, title: "3. What is the Line Length of the Common Rafter on Major roof?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.majorSpanInches * p.sgf90, formula: "Common Rafter Line Length = ½ × Major Span × 90° SGF", explanation: `Line Length = ½ × ${RafterMath.formatFeetInches(p.majorSpanInches)} × ${p.sgf90.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.majorSpanInches * p.sgf90)} (${(0.5 * p.majorSpanInches * p.sgf90 / 12).toFixed(3)} ft)` },
                    { id: 4, title: "4. Major Hip Jack Common Difference", type: "single", unitType: "length_inches_or_feet", targetInches: p.ocSpacing * p.sgf90, formula: "Major Hip Jack Common Difference = On Center Spacing × 90° SGF", explanation: `Common Difference = ${p.ocSpacing}" × ${p.sgf90.toFixed(4)} = ${(p.ocSpacing * p.sgf90).toFixed(3)}" (${RafterMath.formatFeetInches(p.ocSpacing * p.sgf90)})` },
                    { id: 5, title: "5. If laid out from corner, what would the 1st, 2nd, and 3rd Major Hip Jacks be?", type: "triple", unitType: "length_feet", targetInches1: 1 * p.ocSpacing * p.sgf90, targetInches2: 2 * p.ocSpacing * p.sgf90, targetInches3: 3 * p.ocSpacing * p.sgf90, formula: "Jack Length = N × Major Hip Jack Common Difference", explanation: `1st Jack = ${RafterMath.formatFeetInches(p.ocSpacing * p.sgf90)}\n2nd Jack = ${RafterMath.formatFeetInches(2 * p.ocSpacing * p.sgf90)}\n3rd Jack = ${RafterMath.formatFeetInches(3 * p.ocSpacing * p.sgf90)}` },
                    { id: 6, title: `6. What would a jack be if it was Parameter A (${p.paramA}") from corner?`, type: "single", unitType: "length_inches_or_feet", targetInches: p.paramA * p.sgf90, formula: "Jack Line Length = Parameter A × 90° SGF", explanation: `Jack = ${p.paramA}" × ${p.sgf90.toFixed(4)} = ${(p.paramA * p.sgf90).toFixed(3)}" (${RafterMath.formatFeetInches(p.paramA * p.sgf90)})` },
                    { id: 7, title: "7. What is the Major Hips Line Length?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.majorSpanInches * p.sgf45, formula: "Major Hip Line Length = ½ × Major Span × 45° SGF", explanation: `Major Hip = ½ × ${RafterMath.formatFeetInches(p.majorSpanInches)} × ${p.sgf45.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.majorSpanInches * p.sgf45)} (${(0.5 * p.majorSpanInches * p.sgf45 / 12).toFixed(3)} ft)` },
                    { id: 8, title: "8. What is the Supporting Valley Line Length?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.majorSpanInches * p.sgf45, formula: "Supporting Valley Line Length = ½ × Major Span × 45° SGF", explanation: `Supporting Valley = ½ × ${RafterMath.formatFeetInches(p.majorSpanInches)} × ${p.sgf45.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.majorSpanInches * p.sgf45)} (${(0.5 * p.majorSpanInches * p.sgf45 / 12).toFixed(3)} ft)` },
                    { id: 9, title: "9. What is the length of the Major Ridge?", type: "single", unitType: "length_feet", targetInches: p.buildingLengthInches - (0.5 * p.majorSpanInches), formula: "Major Ridge Length = Length of Building - (½ × Major Span)", explanation: `Major Ridge = ${RafterMath.formatFeetInches(p.buildingLengthInches)} - ${RafterMath.formatFeetInches(0.5 * p.majorSpanInches)} = ${RafterMath.formatFeetInches(p.buildingLengthInches - 0.5 * p.majorSpanInches)}` },
                    { id: 10, title: "10. What is the Minor Ridge Length?", type: "single", unitType: "length_feet", targetInches: p.minorProjectionInches, formula: "Minor Ridge Length = Minor Wall Projection", explanation: `Minor Ridge = ${RafterMath.formatFeetInches(p.minorProjectionInches)}` },
                    { id: 11, title: "11. What is the Minor Hip Line Length?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.minorSpanInches * p.sgf45, formula: "Minor Hip Line Length = ½ × Minor Span × 45° SGF", explanation: `Minor Hip = ½ × ${RafterMath.formatFeetInches(p.minorSpanInches)} × ${p.sgf45.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.minorSpanInches * p.sgf45)}` },
                    { id: 12, title: "12. What is the Supported Valley Line Length?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.minorSpanInches * p.sgf45, formula: "Supported Valley Line Length = ½ × Minor Span × 45° SGF", explanation: `Supported Valley = ½ × ${RafterMath.formatFeetInches(p.minorSpanInches)} × ${p.sgf45.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.minorSpanInches * p.sgf45)}` },
                    { id: 13, title: `13. What is the Valley Cripple Line Length (Param B = ${p.paramB}")?`, type: "single", unitType: "length_inches_or_feet", targetInches: p.paramB * p.sgf90, formula: "Valley Cripple Line Length = Parameter B × 90° SGF", explanation: `Valley Cripple = ${p.paramB}" × ${p.sgf90.toFixed(4)} = ${(p.paramB * p.sgf90).toFixed(3)}" (${RafterMath.formatFeetInches(p.paramB * p.sgf90)})` },
                    { id: 14, title: `14. What is the Major Valley Jack Line Length (Param C = ${p.paramC}")?`, type: "single", unitType: "length_inches_or_feet", targetInches: p.paramC * p.sgf90, formula: "Major Valley Jack Line Length = Parameter C × 90° SGF", explanation: `Major Valley Jack = ${p.paramC}" × ${p.sgf90.toFixed(4)} = ${(p.paramC * p.sgf90).toFixed(3)}" (${RafterMath.formatFeetInches(p.paramC * p.sgf90)})` },
                    { id: 15, title: "15. What is the Hip Valley Cripple Line Length?", type: "single", unitType: "length_feet", targetInches: p.minorOffsetInches * p.sgf90, formula: "Hip Valley Cripple Line Length = Offset of Minor from Corner × 90° SGF", explanation: `Hip Valley Cripple = ${RafterMath.formatFeetInches(p.minorOffsetInches)} × ${p.sgf90.toFixed(4)} = ${RafterMath.formatFeetInches(p.minorOffsetInches * p.sgf90)}` },
                    { id: 16, title: `16. What is the Minor Valley Jack Line Length (Param D = ${p.paramD}")?`, type: "single", unitType: "length_inches_or_feet", targetInches: p.paramD * p.sgf90, formula: "Minor Valley Jack Line Length = Parameter D × 90° SGF", explanation: `Minor Valley Jack = ${p.paramD}" × ${p.sgf90.toFixed(4)} = ${(p.paramD * p.sgf90).toFixed(3)}" (${RafterMath.formatFeetInches(p.paramD * p.sgf90)})` },
                    { id: 17, title: "17. What is the Pin Rafter Line Length on Minor roof?", type: "single", unitType: "length_feet", targetInches: 0.5 * p.minorSpanInches * p.sgf90, formula: "Pin Rafter Minor Roof = ½ × Minor Span × 90° SGF", explanation: `Pin Rafter = ½ × ${RafterMath.formatFeetInches(p.minorSpanInches)} × ${p.sgf90.toFixed(4)} = ${RafterMath.formatFeetInches(0.5 * p.minorSpanInches * p.sgf90)}` }
                ];
            },
            renderAllQuestionsUI() {
                const container = document.getElementById('questions-list-container');
                if (!container) return;
                container.innerHTML = '';
                this.questionsList.forEach((q) => {
                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.id = `q-card-${q.id}`;
                    let inputHtml = '';
                    if (q.type === 'single') {
                        const placeholderText = q.unitType === 'factor' ? "e.g. 1.118 or 1.1180" : "e.g. 24' 6\", 24.5, or 294\"";
                        const labelText = q.unitType === 'factor' ? "Answer (Decimal Factor):" : "Answer:";
                        inputHtml = `<div class="input-group"><label for="input-q-${q.id}" class="input-label">${labelText}</label><input type="text" id="input-q-${q.id}" class="answer-field" placeholder="${placeholderText}" autocomplete="off" /></div>`;
                    } else {
                        inputHtml = `
                            <div class="triple-input-grid">
                                <div class="input-group"><label for="input-q-${q.id}-1" class="input-label">1st Rafter (1 in):</label><input type="text" id="input-q-${q.id}-1" class="answer-field" placeholder="e.g. 1' 6&quot; or 18&quot;" /></div>
                                <div class="input-group"><label for="input-q-${q.id}-2" class="input-label">2nd Rafter (2 in):</label><input type="text" id="input-q-${q.id}-2" class="answer-field" placeholder="e.g. 3' 0&quot; or 36&quot;" /></div>
                                <div class="input-group"><label for="input-q-${q.id}-3" class="input-label">3rd Rafter (3 in):</label><input type="text" id="input-q-${q.id}-3" class="answer-field" placeholder="e.g. 4' 6&quot; or 54&quot;" /></div>
                            </div>
                        `;
                    }
                    card.innerHTML = `
                        <div class="question-header"><span class="q-badge">Q${q.id}</span><h3 class="q-title">${q.title}</h3></div>
                        <div class="question-body">
                            ${inputHtml}
                            <button type="button" class="btn btn-secondary btn-sm" onclick="RafterApp.checkQuestion(${q.id})">Check Q${q.id}</button>
                            <div id="feedback-q-${q.id}" class="feedback-box hidden"></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
                const scoreBanner = document.getElementById('score-summary-banner');
                if (scoreBanner) scoreBanner.className = 'score-summary-box hidden';
            },
            checkQuestion(qId) {
                const q = this.questionsList.find(item => item.id === qId);
                if (!q) return false;
                const feedbackBox = document.getElementById(`feedback-q-${qId}`);
                let isCorrect = false;
                if (q.type === 'single') {
                    const rawVal = document.getElementById(`input-q-${qId}`)?.value || '';
                    if (q.unitType === 'factor') {
                        const userVal = parseFloat(rawVal);
                        if (!isNaN(userVal) && Math.abs(userVal - q.targetValue) < 0.006) isCorrect = true;
                    } else {
                        const parsedInches = RafterMath.parseInputToInches(rawVal);
                        if (parsedInches !== null) {
                            if (Math.abs(parsedInches - q.targetInches) <= 0.75 || Math.abs((parsedInches * 12) - q.targetInches) <= 0.75) isCorrect = true;
                        }
                    }
                } else if (q.type === 'triple') {
                    const v1 = RafterMath.parseInputToInches(document.getElementById(`input-q-${qId}-1`)?.value);
                    const v2 = RafterMath.parseInputToInches(document.getElementById(`input-q-${qId}-2`)?.value);
                    const v3 = RafterMath.parseInputToInches(document.getElementById(`input-q-${qId}-3`)?.value);
                    const m1 = v1 !== null && (Math.abs(v1 - q.targetInches1) <= 0.75 || Math.abs((v1 * 12) - q.targetInches1) <= 0.75);
                    const m2 = v2 !== null && (Math.abs(v2 - q.targetInches2) <= 0.75 || Math.abs((v2 * 12) - q.targetInches2) <= 0.75);
                    const m3 = v3 !== null && (Math.abs(v3 - q.targetInches3) <= 0.75 || Math.abs((v3 * 12) - q.targetInches3) <= 0.75);
                    if (m1 && m2 && m3) isCorrect = true;
                }

                if (isCorrect) {
                    feedbackBox.className = 'feedback-box feedback-correct';
                    feedbackBox.innerHTML = `<div class="feedback-title">✓ Correct!</div><div class="feedback-body">Great job! Your framing calculation is accurate.</div>`;
                } else {
                    feedbackBox.className = 'feedback-box feedback-incorrect';
                    let answerSummary = '';
                    if (q.type === 'single') {
                        answerSummary = q.unitType === 'factor' ? `<strong>Correct Answer:</strong> ${q.targetValue.toFixed(4)}` : `<strong>Correct Answer:</strong> ${RafterMath.formatFeetInches(q.targetInches)} (${RafterMath.formatDecimalFeet(q.targetInches)})`;
                    } else {
                        answerSummary = `<strong>Correct Answers:</strong><br>• 1st: ${RafterMath.formatFeetInches(q.targetInches1)}<br>• 2nd: ${RafterMath.formatFeetInches(q.targetInches2)}<br>• 3rd: ${RafterMath.formatFeetInches(q.targetInches3)}`;
                    }
                    feedbackBox.innerHTML = `
                        <div class="feedback-title">✗ Incorrect</div>
                        <div class="feedback-body">
                            <p>${answerSummary}</p>
                            <div class="formula-note">
                                <div class="formula-header">📐 Framing Formula & Solution Steps:</div>
                                <div class="formula-code">${q.formula}</div>
                                <div class="formula-explanation">${q.explanation.replace(/\n/g, '<br>')}</div>
                            </div>
                        </div>
                    `;
                }
                return isCorrect;
            },
            checkAllAnswers() {
                let numCorrect = 0, total = this.questionsList.length;
                this.questionsList.forEach(q => { if (this.checkQuestion(q.id)) numCorrect++; });
                const pct = Math.round((numCorrect / total) * 100);
                const scoreBanner = document.getElementById('score-summary-banner');
                if (scoreBanner) {
                    scoreBanner.className = `score-summary-box ${numCorrect === total ? 'score-perfect' : 'score-normal'}`;
                    scoreBanner.innerHTML = `<div class="score-title">Worksheet Result: ${numCorrect} / ${total} Correct (${pct}%)</div><div class="score-subtitle">${numCorrect === total ? '🎉 Perfect Score!' : 'Review step-by-step formula solutions for any incorrect answers above.'}</div>`;
                }
            },
            init() {
                this.generateParameters();
                document.getElementById('btn-generate-scenario')?.addEventListener('click', () => this.generateParameters());
                document.getElementById('btn-check-all')?.addEventListener('click', () => this.checkAllAnswers());
            }
        };
        document.addEventListener('DOMContentLoaded', () => window.RafterApp.init());
    }
</script></p></body></html>
